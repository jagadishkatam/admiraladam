name: PR checks (R package)

on:
  pull_request:
    branches: [main, master]

jobs:
  r-cmd-check:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        r-version: ['release', 'devel']

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}
          use-public-rspm: true

      - name: Setup R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::lintr
          needs: check

      - name: R CMD check (fail on warnings)
        uses: r-lib/actions/check-r-package@v2
        with:
          error-on: '"warning"'
          args: 'c("--no-manual", "--as-cran")'

      - name: Lint package
        run: |
          lintr::lint_package()
        shell: Rscript {0}

      - name: Validate package assets
        run: |
          # Ensure inst/ exists
          if (!dir.exists("inst")) {
            stop("inst/ directory is missing")
          }

          # Disallow non-portable filenames
          bad_files <- list.files(
            "inst",
            recursive = TRUE,
            pattern = "[()[:space:]]"
          )

          if (length(bad_files) > 0) {
            stop(
              "Non-portable filenames detected:\n",
              paste(bad_files, collapse = "\n")
            )
          }
        shell: Rscript {0}
