# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v3

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: R CMD check (fail on warnings)
        uses: r-lib/actions/check-r-package@v2
        with:
          error-on: '"warning"'
          args: 'c("--no-manual", "--as-cran")'

      - name: Lint package
        run: |
          install.packages("lintr")
          lintr::lint_package()
        shell: Rscript {0}

      - name: Validate package assets
        run: |
          # Ensure inst/ exists
          if (!dir.exists("inst")) {
            stop("inst/ directory is missing")
          }

          # Disallow non-portable filenames
          bad_files <- list.files(
            "inst",
            recursive = TRUE,
            pattern = "[()[:space:]]"
          )

          if (length(bad_files) > 0) {
            stop(
              "Non-portable filenames detected:\n",
              paste(bad_files, collapse = "\n")
            )
          }
        shell: Rscript {0}


